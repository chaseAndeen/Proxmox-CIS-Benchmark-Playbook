name: Ansible CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint

      - name: Check Ansible syntax
        run: |
          ansible-playbook --syntax-check -i inventory.yaml audit.yaml
          ansible-playbook --syntax-check -i inventory.yaml remediate.yaml

      - name: Lint Ansible files
        run: ansible-lint audit.yaml remediate.yaml tasks/*.yaml
