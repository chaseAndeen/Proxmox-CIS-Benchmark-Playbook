---

- name: Announce current CIS control
  ansible.builtin.debug:
    msg: "Starting remediation for {{ module.control_id }}: Ensure {{ module.name }} kernel module is not available"

- name: Enforce control kernal module {{ module.name }}
  vars:
    module_result: "{{ (module_status | default({}))[module.name] | default({}) }}"
  when: >-
    module_result.present | default(false)
    and not (
      (module_result.blacklisted | default(false))
      and (module_result.install_disabled | default(false))
    )
  block:
    - name: Unload kernel module {{ module.name }}
      ansible.builtin.shell: modprobe -r {{ module.name }} 2>/dev/null || rmmod {{ module.name }} 2>/dev/null
      changed_when: true
      when: module_result.loaded | default(false)

    - name: Disable loading for {{ module.name }}
      ansible.builtin.copy:
        dest: /etc/modprobe.d/60-{{ module.name }}.conf
        content: |
          install {{ module.name }} /bin/false
          blacklist {{ module.name }}
        owner: root
        group: root
        mode: '0644'
